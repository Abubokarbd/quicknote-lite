<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote Lite</title>

  <link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&display=swap">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script defer src="js/pagination.js"></script>
  <script defer src="js/editor.js"></script>
  <script defer src="js/formatting.js"></script>
  <script defer src="js/export-pdf.js"></script>
  <script defer src="js/export-png.js"></script>
  <script defer src="js/app.js"></script>
</head>

<body>
  <header class="app-header">
    <h1>QuickNote Lite</h1>
    <p>Lightweight A4 document editor</p>
  </header>

  <nav class="toolbar" aria-label="Formatting toolbar">
    <button type="button" data-command="bold" title="Bold">
      <strong>B</strong>
    </button>

    <button type="button" data-command="italic" title="Italic">
      <em>I</em>
    </button>

    <button type="button" data-command="underline" title="Underline">
      <u>U</u>
    </button>

    <span class="toolbar-divider"></span>

    <button type="button" data-align="left" title="Align left">Left</button>
    <button type="button" data-align="center" title="Align center">Center</button>
    <button type="button" data-align="right" title="Align right">Right</button>
    <button type="button" data-align="justify" title="Justify">Justify</button>

    <span class="toolbar-divider"></span>

    <label for="font-size">Font size</label>
    <select id="font-size">
      <option value="12">12</option>
      <option value="14" selected>14</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
      <option value="28">28</option>
      <option value="32">32</option>
    </select>

    <label for="text-color">Text color</label>
    <input id="text-color" type="color" value="#000000">

    <span class="toolbar-divider"></span>

    <button type="button" id="add-page">Add page</button>
    <button type="button" id="download-pdf">Download PDF</button>
    <button type="button" id="download-png">Download PNG</button>
  </nav>

  <main id="document-container" class="document-container">
    <section class="a4-page">
      <div class="editor-page"
           contenteditable="true"
           spellcheck="true"
           role="textbox"
           aria-label="Document page 1"
           data-page="1"></div>

      <footer class="page-footer">
        <span class="page-number">1</span>
      </footer>
    </section>
  </main>

  <script>
    // No inline event handlers are required.
    // App initialization and event wiring live in js/app.js.
  </script>
</body>
</html>
