<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote - Smart Note Maker</title>
  
  <!-- SolaimanLipi Font -->
  <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  
  <!-- HTML2Canvas & jsPDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>
  
  <div class="app-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="control-group">
        <label>এলাইনমেন্ট:</label>
        <button onclick="setTextAlign('left')">বাম</button>
        <button onclick="setTextAlign('center')">মাঝখান</button>
        <button onclick="setTextAlign('right')">ডান</button>
        <button onclick="setTextAlign('justify')">জাস্টিফাই</button>
      </div>

      <div class="control-group">
        <label>ফন্ট সাইজ:</label>
        <input type="number" id="fontSizeInput" value="18" min="12" max="40" onchange="changeFontSize(this.value)">
        <span>px</span>
      </div>

      <div class="control-group">
        <button class="btn-secondary" id="pdfBtn" onclick="exportToPDF()">PDF ডাউনলোড</button>
        <button class="btn-secondary" id="pngBtn" onclick="exportToPNG()">PNG ডাউনলোড</button>
      </div>
    </div>

    <!-- Container for A4 Pages -->
    <div id="documentPages">
      <div class="a4-page" id="page-1">
        <div class="editor-page" contenteditable="true" placeholder="এখানে লেখা টাইপ বা পেস্ট করুন..." oninput="handleInput(this)" onpaste="handlePaste(event, this)"></div>
        <div class="page-footer" style="display:none;">পৃষ্ঠা ১</div>
      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="js/core.js"></script>
  <script src="js/paginate.js"></script>
  <script src="js/export.js"></script>
</body>
</html>
