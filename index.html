<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNote - Smart Note Maker</title>
  
  <!-- SolaimanLipi Font -->
  <link href="https://fonts.maateen.me/solaiman-lipi/font.css" rel="stylesheet">
  
  <!-- HTML2Canvas & jsPDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/page.css">
</head>
<body>

  <div class="app-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <!-- Alignment Controls -->
      <div class="toolbar-section">
        <span class="toolbar-label">Alignment</span>
        <div class="btn-group">
          <button class="tool-btn" onclick="setTextAlign('left')" title="Align Left">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M2 12.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
          </button>
          <button class="tool-btn" onclick="setTextAlign('center')" title="Align Center">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M4 12.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
          </button>
          <button class="tool-btn" onclick="setTextAlign('right')" title="Align Right">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6 12.5a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-4-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
          </button>
          <button class="tool-btn" onclick="setTextAlign('justify')" title="Justify">
            <svg width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M2 12.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5zm0-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
          </button>
        </div>
      </div>

      <!-- Formatting Controls (Bold, Italic, Underline) -->
      <div class="toolbar-section">
        <span class="toolbar-label">Format</span>
        <div class="btn-group">
          <button class="tool-btn" onclick="formatText('bold')" title="Bold"><b>B</b></button>
          <button class="tool-btn" onclick="formatText('italic')" title="Italic"><i>I</i></button>
          <button class="tool-btn" onclick="formatText('underline')" title="Underline"><u>U</u></button>
        </div>
      </div>

      <!-- Font Size Slider Control -->
      <div class="toolbar-section">
        <span class="toolbar-label">Size: <span id="fontSizeValue">18</span>px</span>
        <div class="slider-wrapper">
          <input type="range" id="fontSizeRange" min="12" max="40" value="18" oninput="changeFontSize(this.value)">
        </div>
      </div>

      <!-- Export Buttons -->
      <div class="toolbar-section action-group">
        <button class="btn-action btn-pdf" id="pdfBtn" onclick="exportToPDF()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          PDF
        </button>
        <button class="btn-action btn-png" id="pngBtn" onclick="exportToPNG()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          PNG
        </button>
      </div>
    </div>

    <!-- Container for A4 Pages -->
    <div id="documentPages">
      <div class="a4-page" id="page-1">
        <div class="editor-page" contenteditable="true" placeholder="এখানে লেখা টাইপ বা পেস্ট করুন..." oninput="handleInput(this)" onpaste="handlePaste(event, this)"></div>
        <div class="page-footer" style="display:none;">পৃষ্ঠা ১</div>
      </div>
    </div>
  </div>

  <!-- JavaScript Files -->
  <script src="js/core.js"></script>
  <script src="js/paginate.js"></script>
  <script src="js/export.js"></script>
</body>
</html>
